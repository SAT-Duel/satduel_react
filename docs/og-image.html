<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SAT Duel OG card generator</title>
<!--
  Source for every card in public/og/. One variant per public page, selected
  with ?v=<key> — see VARIANTS below. Regenerate them all with:

      npm run og

  Each card leads with the ONE thing its page is for, so a shared link
  advertises that feature rather than the product in general.
-->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Inter, sans-serif; background: #0A1120; position: relative; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148,163,184,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.055) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glow {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    top: -340px; right: -240px;
    background: radial-gradient(circle, var(--glow-a) 0%, transparent 62%);
  }
  .glow2 {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    bottom: -390px; left: -190px;
    background: radial-gradient(circle, var(--glow-b) 0%, transparent 62%);
  }

  .wrap {
    position: relative; height: 100%; padding: 58px 66px;
    display: grid; grid-template-columns: 1fr 392px; grid-template-rows: 1fr;
    gap: 52px; align-items: stretch;
  }
  .left { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }

  .brand { display: flex; align-items: center; gap: 15px; }
  .brand .mark {
    width: 54px; height: 54px; border-radius: 15px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .brand img { width: 42px; height: 42px; }
  .brand .name {
    font-family: Poppins, sans-serif; font-weight: 800; font-size: 27px;
    color: #fff; letter-spacing: -.02em;
  }
  .brand .name span { color: var(--accent-lbl); }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px; align-self: flex-start;
    font-family: "JetBrains Mono", monospace; font-weight: 700;
    font-size: 13.5px; letter-spacing: .1em; color: var(--accent-lbl);
    border: 1px solid var(--accent-brd); background: var(--accent-bg);
    padding: 8px 14px; border-radius: 999px; margin-bottom: 22px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-lbl); }

  h1 {
    font-family: Poppins, sans-serif; font-weight: 800;
    font-size: 60px; line-height: 1.05; letter-spacing: -.035em; color: #fff;
  }
  h1 em { font-style: normal; color: var(--accent-lbl); }
  p.sub {
    margin-top: 20px; font-size: 22px; line-height: 1.45;
    color: #AEB7CC; max-width: 620px; font-weight: 400;
  }

  .stats { display: flex; gap: 12px; align-items: center; margin-top: 30px; }
  .pill {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid rgba(148,163,184,.20); background: rgba(16,26,46,.75);
    border-radius: 13px; padding: 12px 18px;
  }
  .pill b {
    font-family: Poppins, sans-serif; font-size: 21px; font-weight: 800;
    color: #fff; letter-spacing: -.02em;
  }
  .pill span { font-size: 15px; color: #AEB7CC; font-weight: 500; white-space: nowrap; }
  .pill b { white-space: nowrap; }
  .url {
    font-family: "JetBrains Mono", monospace; font-weight: 700;
    font-size: 19px; color: #7C8AA5; margin-left: auto;
  }

  /* ---------- right-hand product motif ---------- */
  .motif {
    align-self: center;
    background: #101A2E; border: 1px solid rgba(148,163,184,.22);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.45);
  }
  .motif-head {
    padding: 13px 18px; background: #131B2C;
    border-bottom: 1px solid rgba(148,163,184,.16);
    font-family: "JetBrains Mono", monospace; font-size: 12px;
    letter-spacing: .11em; color: var(--accent-lbl); font-weight: 700;
  }
  .motif-body { padding: 18px; display: flex; flex-direction: column; gap: 10px; }

  .choice {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 11px;
    border: 1px solid rgba(148,163,184,.18); background: #16223A;
    font-size: 16px; color: #EDF0F7; font-weight: 500;
  }
  .choice .k {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid rgba(148,163,184,.4);
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-size: 12px;
    font-weight: 700; color: #AEB7CC;
  }
  .choice.right {
    border-color: rgba(47,191,113,.6); background: rgba(47,191,113,.14);
    color: #fff; font-weight: 650;
  }
  .choice.right .k {
    border-color: #2FBF71; background: #2FBF71; color: #06281A;
  }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 11px;
    border: 1px solid rgba(148,163,184,.16); background: #16223A;
    font-size: 15.5px; color: #EDF0F7;
  }
  .row .rank {
    font-family: "JetBrains Mono", monospace; font-size: 14px;
    color: #7C8AA5; font-weight: 700; width: 20px; flex-shrink: 0;
  }
  .row .who { font-weight: 600; }
  .row .val {
    margin-left: auto; font-family: "JetBrains Mono", monospace;
    font-size: 15px; font-weight: 700; color: var(--accent-lbl);
  }
  .row.lead { border-color: var(--accent-brd); background: var(--accent-bg); }
  .row.lead .rank { color: var(--accent-lbl); }

  .avatar {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(140deg, var(--accent-lbl), rgba(124,92,240,.5));
  }

  .code-box { text-align: center; padding: 26px 18px 22px; }
  .code-box .lbl {
    font-family: "JetBrains Mono", monospace; font-size: 12px;
    letter-spacing: .13em; color: #7C8AA5; font-weight: 700;
  }
  .code-box .code {
    font-family: "JetBrains Mono", monospace; font-size: 54px;
    font-weight: 700; color: #fff; letter-spacing: .1em; margin-top: 10px;
    line-height: 1;
  }
  .players { display: flex; justify-content: center; gap: 7px; margin-top: 20px; }
  .players i {
    width: 30px; height: 30px; border-radius: 10px; display: block;
    background: linear-gradient(140deg, #2FBF71, rgba(47,191,113,.4));
  }
  .players i:nth-child(2) { background: linear-gradient(140deg, #7C5CF0, rgba(124,92,240,.4)); }
  .players i:nth-child(3) { background: linear-gradient(140deg, #06B6D4, rgba(6,182,212,.4)); }
  .players i:nth-child(4) { background: linear-gradient(140deg, #F59E0B, rgba(245,158,11,.4)); }
  .players i:nth-child(5) { background: linear-gradient(140deg, #F0576F, rgba(240,87,111,.4)); }

  .lesson {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 11px;
    border: 1px solid rgba(148,163,184,.16); background: #16223A;
    font-size: 15px; color: #EDF0F7; font-weight: 500;
  }
  .lesson .num {
    font-family: "JetBrains Mono", monospace; font-size: 12px;
    color: var(--accent-lbl); font-weight: 700; flex-shrink: 0;
  }
  .lesson .tick { margin-left: auto; color: #2FBF71; font-size: 16px; }

  .formula {
    padding: 20px 18px; text-align: center;
    font-family: "JetBrains Mono", monospace; color: #fff;
    font-size: 27px; font-weight: 700; letter-spacing: -.01em;
  }
  .formula small { display: block; font-size: 13px; color: #7C8AA5; margin-top: 12px; letter-spacing: .1em; }

  .passage {
    padding: 16px; font-size: 15px; line-height: 1.75; color: #AEB7CC;
  }
  .passage mark {
    background: rgba(6,182,212,.22); color: #67E8F9;
    padding: 1px 4px; border-radius: 4px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <div class="mark"><img src="../public/logo512.png" alt=""></div>
        <div class="name">SAT<span>Duel</span></div>
      </div>
      <div>
        <div class="eyebrow"><i class="dot"></i><span id="eyebrow"></span></div>
        <h1 id="head"></h1>
        <p class="sub" id="sub"></p>
        <div class="stats" id="stats"></div>
      </div>
    </div>
    <div class="motif" id="motif"></div>
  </div>

<script>
const A = {
  violet: {lbl: '#A78BFF', brd: 'rgba(124,92,240,.45)', bg: 'rgba(124,92,240,.14)',
           glowA: 'rgba(124,92,240,.30)', glowB: 'rgba(6,182,212,.16)'},
  green:  {lbl: '#4ADE80', brd: 'rgba(47,191,113,.45)', bg: 'rgba(47,191,113,.14)',
           glowA: 'rgba(47,191,113,.26)', glowB: 'rgba(124,92,240,.20)'},
  gold:   {lbl: '#F5C451', brd: 'rgba(245,158,11,.45)', bg: 'rgba(245,158,11,.13)',
           glowA: 'rgba(245,158,11,.24)', glowB: 'rgba(124,92,240,.20)'},
  cyan:   {lbl: '#67E8F9', brd: 'rgba(6,182,212,.45)',  bg: 'rgba(6,182,212,.13)',
           glowA: 'rgba(6,182,212,.26)',  glowB: 'rgba(124,92,240,.20)'},
};

const pill = (b, s) => `<div class="pill"><b>${b}</b><span>${s}</span></div>`;
const url  = '<div class="url">satduel.com</div>';

const VARIANTS = {
  // The site-wide fallback: index.html and anything without its own card.
  default: {
    accent: A.violet, eyebrow: 'DIGITAL SAT &middot; MATH + READING &amp; WRITING',
    head: 'Turn Digital SAT practice into a <em>duel</em>.',
    sub: 'Practice real-format questions, host live party games with friends, and track every mistake.',
    stats: pill('1,800+', 'questions') + pill('Live', 'duels &amp; parties') + pill('Free', 'to start') + url,
    motif: choices(),
  },

  practice: {
    accent: A.violet, eyebrow: 'ADAPTIVE PRACTICE',
    head: 'One real question at a time. <em>Rated</em>.',
    sub: 'Every answer moves your Practice Elo, so you always know whether the work is landing.',
    stats: pill('1,800+', 'real-format questions') + pill('AI', 'explanations') + url,
    motif: choices(),
  },

  math: {
    accent: A.gold, eyebrow: 'SAT MATH PRACTICE',
    head: 'Algebra to geometry, <em>one rep at a time</em>.',
    sub: 'Adaptive Math practice across all four Digital SAT domains, with worked explanations on every miss.',
    stats: pill('4', 'math domains') + pill('Desmos', 'built in') + url,
    motif: `<div class="motif-head">ADVANCED MATH</div>
      <div class="formula">x&sup2; &minus; 6x + 5 = 0<small>SOLVE FOR ALL REAL x</small></div>`,
  },

  english: {
    accent: A.cyan, eyebrow: 'READING &amp; WRITING PRACTICE',
    head: 'Read the task, <em>then</em> the text.',
    sub: 'Words in context, transitions, evidence and grammar &mdash; drilled as the skills they actually test.',
    stats: pill('6', 'question types') + pill('Instant', 'explanations') + url,
    motif: `<div class="motif-head">WORDS IN CONTEXT</div>
      <div class="passage">The committee&rsquo;s findings were far from
      <mark>definitive</mark>; several members noted that the data raised more
      questions than it settled.</div>`,
  },

  party: {
    accent: A.green, eyebrow: 'LIVE MULTIPLAYER &middot; UP TO 20 PLAYERS',
    head: 'SAT questions, <em>but with your friends</em>.',
    sub: 'Host a room, share the code, and race your class through real SAT questions in real time.',
    stats: pill('20', 'players') + pill('4', 'game modes') + pill('Free', 'to host') + url,
    motif: `<div class="motif-head">ROOM IS LIVE</div>
      <div class="code-box">
        <div class="lbl">JOIN CODE</div>
        <div class="code">418 062</div>
        <div class="players"><i></i><i></i><i></i><i></i><i></i></div>
      </div>`,
  },

  tournaments: {
    accent: A.gold, eyebrow: 'TOURNAMENTS &middot; LIVE LEADERBOARDS',
    head: 'Run an SAT tournament for <em>your whole school</em>.',
    sub: 'Create a bracket, share one link, and watch the standings move as students answer.',
    stats: pill('Live', 'standings') + pill('1 link', 'to invite') + url,
    motif: `<div class="motif-head">STANDINGS</div>
      <div class="motif-body">
        ${row('1', 'maya_r', '1,840', true)}
        ${row('2', 'devonk', '1,795')}
        ${row('3', 'sam.p', '1,742')}
        ${row('4', 'aliyah', '1,701')}
      </div>`,
  },

  studyGuide: {
    accent: A.violet, eyebrow: 'STUDY GUIDES &middot; MATH + ENGLISH',
    head: 'The whole Digital SAT, <em>explained in order</em>.',
    sub: 'Short lessons that build on each other, so you always know what to learn next.',
    stats: pill('78', 'lessons') + pill('Free', 'to start') + url,
    motif: `<div class="motif-head">MODULE 2 &middot; ALGEBRA</div>
      <div class="motif-body">
        ${lesson('01', 'Linear vs. exponential', true)}
        ${lesson('02', 'Growth factors', true)}
        ${lesson('03', 'Choosing useful forms')}
        ${lesson('04', 'Equations with parameters')}
      </div>`,
  },

  diagnostic: {
    accent: A.cyan, eyebrow: 'FREE DIAGNOSTIC &middot; 2 MINUTES',
    head: 'Find your starting score <em>before</em> you study.',
    sub: 'A short adaptive check that estimates your level and points you at what to fix first.',
    stats: pill('2 min', 'to finish') + pill('No', 'account needed') + url,
    motif: `<div class="motif-head">ESTIMATED SCORE</div>
      <div class="formula">1180 &ndash; 1240<small>MATH 610 &middot; READING &amp; WRITING 600</small></div>`,
  },
};

function choices() {
  return `<div class="motif-head">QUESTION 1 OF 10</div>
    <div class="motif-body">
      <div class="choice"><span class="k">A</span>y = 2x + 3</div>
      <div class="choice right"><span class="k">B</span>y = 3x &minus; 2</div>
      <div class="choice"><span class="k">C</span>y = &minus;2x + 3</div>
      <div class="choice"><span class="k">D</span>y = 3x + 2</div>
    </div>`;
}
function row(rank, who, val, lead) {
  return `<div class="row${lead ? ' lead' : ''}"><span class="rank">${rank}</span>
    <span class="avatar"></span><span class="who">${who}</span><span class="val">${val}</span></div>`;
}
function lesson(num, title, done) {
  return `<div class="lesson"><span class="num">${num}</span>${title}
    ${done ? '<span class="tick">&check;</span>' : ''}</div>`;
}

const key = new URLSearchParams(location.search).get('v') || 'default';
const v = VARIANTS[key] || VARIANTS.default;
const root = document.documentElement.style;
root.setProperty('--accent-lbl', v.accent.lbl);
root.setProperty('--accent-brd', v.accent.brd);
root.setProperty('--accent-bg', v.accent.bg);
root.setProperty('--glow-a', v.accent.glowA);
root.setProperty('--glow-b', v.accent.glowB);
document.getElementById('eyebrow').innerHTML = v.eyebrow;
document.getElementById('head').innerHTML = v.head;
document.getElementById('sub').innerHTML = v.sub;
document.getElementById('stats').innerHTML = v.stats;
document.getElementById('motif').innerHTML = v.motif;
document.title = 'og:' + key;
</script>
</body>
</html>
